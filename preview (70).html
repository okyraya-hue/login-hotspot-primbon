<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuloNet Hotspot Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:
  radial-gradient(circle at top,#1e3a8a,#020617);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.brand{
  font-size:24px;
  font-weight:700;
  text-align:center;
  margin-bottom:5px;
  background:linear-gradient(to right,#38bdf8,#60a5fa,#f59e0b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  opacity:.8;
  margin-bottom:20px;
  font-size:13px;
}

form{
  display:flex;
  flex-direction:column;
  gap:12px;
}

input{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  padding:0 15px;
  background:rgba(255,255,255,0.12);
  color:white;
  font-size:15px;
}

input::placeholder{
  color:#ddd;
}

button{
  height:50px;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  font-size:15px;
}

button:hover{
  transform:scale(1.02);
}

.login-btn{
  background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.menu-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  color:white;
  font-weight:600;
}

.paket-btn{
  background:linear-gradient(135deg,#22c55e,#15803d);
}

.primbon-btn{
  background:linear-gradient(135deg,#ec4899,#be185d);
}

.website-btn{
  background:linear-gradient(135deg,#f59e0b,#d97706);
}

.footer{
  margin-top:15px;
  text-align:center;
  opacity:.7;
  font-size:12px;
}

.hidden{
  display:none;
}

.voucher{
  background:rgba(255,255,255,0.08);
  border-radius:16px;
  padding:15px;
  margin-top:10px;
}

.buy-btn{
  width:100%;
  margin-top:10px;
  background:linear-gradient(135deg,#f59e0b,#d97706);
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  padding:15px;
}

.popup-content{
  width:100%;
  max-width:450px;
  background:#111827;
  border-radius:24px;
  padding:25px;
  max-height:90vh;
  overflow:auto;
}

.popup-title{
  text-align:center;
  margin-bottom:20px;
  font-size:22px;
  color:#facc15;
}

.box{
  background:rgba(255,255,255,0.06);
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  border-left:4px solid #f59e0b;
}

.box h3{
  margin-bottom:8px;
  color:#facc15;
}

.close-btn{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  width:100%;
  margin-top:10px;
}

.share-btn{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username"/>
<input type="hidden" name="password"/>
<input type="hidden" name="dst" value="$(link-orig)"/>
<input type="hidden" name="popup" value="true"/>
</form>

<script src="md5.js"></script>

<script>
function doLogin(){
document.sendin.username.value=document.login.username.value;
document.sendin.password.value=
hexMD5('$(chap-id)'+document.login.username.value+'$(chap-challenge)');
document.sendin.submit();
return false;
}
</script>
$(endif)

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">

<div class="brand">
PULONET HOTSPOT
</div>

<div class="subtitle">
Login Voucher Internet Premium
</div>

<form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">

<input type="hidden" name="dst" value="$(link-orig)">
<input type="hidden" name="popup" value="true">

<input name="username" type="text" placeholder="Masukkan Voucher..." required>

<input name="password" type="hidden">

<button class="login-btn" type="submit">
🚀 LOGIN INTERNET
</button>

</form>

<a href="#" onclick="showVoucher()" class="menu-btn paket-btn">
💎 Beli Paket Internet
</a>

<a href="#" onclick="openPrimbon()" class="menu-btn primbon-btn">
🔮 Primbon Berdasarkan Tanggal Lahir
</a>

<a href="#" onclick="openWeb()" class="menu-btn website-btn">
🛒 Jasa Pembuatan Website
</a>

<div class="footer">
Support WA : 0895-1323-7203
</div>

<div class="footer">
© PULONET HOTSPOT
</div>

</div>

<!-- VOUCHER -->
<div class="card hidden" id="voucherBox">

<div class="brand">
PAKET INTERNET
</div>

<div class="voucher">
1 Hari — Rp 3.000
<button class="buy-btn" onclick="beli('1 Hari')">
Beli Paket
</button>
</div>

<div class="voucher">
2 Hari — Rp 5.000
<button class="buy-btn" onclick="beli('2 Hari')">
Beli Paket
</button>
</div>

<div class="voucher">
7 Hari — Rp 15.000
<button class="buy-btn" onclick="beli('7 Hari')">
Beli Paket
</button>
</div>

<div class="voucher">
30 Hari — Rp 55.000
<button class="buy-btn" onclick="beli('30 Hari')">
Beli Paket
</button>
</div>

<button class="close-btn" onclick="backLogin()">
Kembali
</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

<div class="popup-content">

<div class="popup-title" id="popupTitle"></div>

<div id="popupBody"></div>

<button class="close-btn" onclick="closePopup()">
Tutup
</button>

</div>

</div>

<script>

var username=document.login.username;
var password=document.login.password;

username.onkeyup=function(){
password.value=username.value;
}

function showVoucher(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("voucherBox").classList.remove("hidden");
}

function backLogin(){
document.getElementById("voucherBox").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
}

function beli(paket){
alert("Hubungi WA 0895-1323-7203 untuk membeli paket "+paket);
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function openWeb(){

document.getElementById("popup").style.display="flex";
document.getElementById("popupTitle").innerHTML=
"🛒 Jasa Website";

document.getElementById("popupBody").innerHTML=`

<div class="box">
<h3>✔ Website UMKM</h3>
<p>Website profesional untuk usaha & bisnis.</p>
</div>

<div class="box">
<h3>✔ Login Hotspot</h3>
<p>Custom login hotspot elegan & premium.</p>
</div>

<div class="box">
<h3>✔ Website Zodiak & Primbon</h3>
<p>Web viral siap upload ke internet.</p>
</div>

<div class="box">
<h3>📱 Hubungi</h3>
<p>WA : 0895-1323-7203</p>
</div>

`;

}

function openPrimbon(){

document.getElementById("popup").style.display="flex";

document.getElementById("popupTitle").innerHTML=
"🔮 Primbon Nusantara";

document.getElementById("popupBody").innerHTML=`

<div class="box">
<h3>📅 Masukkan Tanggal Lahir</h3>

<input type="date" id="tanggalLahir"
style="margin-top:10px">

<button onclick="hitungPrimbon()"
style="margin-top:12px;
background:linear-gradient(135deg,#ec4899,#be185d)">
Lihat Hasil
</button>

</div>

<div id="hasilPrimbon"></div>

`;

}

const hariList=[
"Minggu","Senin","Selasa",
"Rabu","Kamis","Jumat","Sabtu"
];

const wetonList=[
"Legi","Pahing","Pon","Wage","Kliwon"
];

const unsurList=[
{
nama:"Api",
sifat:"Berani, kuat dan penuh ambisi."
},
{
nama:"Air",
sifat:"Tenang, bijaksana dan intuitif."
},
{
nama:"Tanah",
sifat:"Setia, pekerja keras dan stabil."
},
{
nama:"Angin",
sifat:"Kreatif, bebas dan cepat berpikir."
}
];

const karirList=[
"Cocok menjadi pengusaha atau pemimpin.",
"Berpotensi sukses di bidang teknologi.",
"Memiliki bakat seni dan kreativitas tinggi.",
"Cocok menjadi guru atau pembimbing.",
"Berbakat dalam bisnis dan komunikasi."
];

const uangList=[
"Mulailah disiplin menabung sejak dini.",
"Rezeki datang dari koneksi dan relasi.",
"Hindari pengeluaran impulsif.",
"Cocok memiliki usaha sampingan.",
"Keuangan stabil jika fokus pada tujuan."
];

function hitungPrimbon(){

const input=document.getElementById("tanggalLahir").value;

if(!input){
alert("Masukkan tanggal lahir terlebih dahulu");
return;
}

const tgl=new Date(input);

const hari=hariList[tgl.getDay()];

const total=
tgl.getDate()+
(tgl.getMonth()+1)+
tgl.getFullYear();

const weton=wetonList[total%5];

const unsur=unsurList[total%4];

const karir=
karirList[total%karirList.length];

const uang=
uangList[total%uangList.length];

let sifat="";

if(total%2==0){
sifat=
"Memiliki aura positif dan semangat tinggi.";
}else{
sifat=
"Tenang, intuitif dan pemikir mendalam.";
}

document.getElementById("hasilPrimbon").innerHTML=`

<div class="box">
<h3>📅 Hari Lahir</h3>
<p>${hari}</p>
</div>

<div class="box">
<h3>🌙 Weton</h3>
<p>${weton}</p>
</div>

<div class="box">
<h3>🔥 Unsur Alam</h3>
<p>${unsur.nama} — ${unsur.sifat}</p>
</div>

<div class="box">
<h3>💼 Karier</h3>
<p>${karir}</p>
</div>

<div class="box">
<h3>💰 Nasihat Keuangan</h3>
<p>${uang}</p>
</div>

<div class="box">
<h3>✨ Kepribadian</h3>
<p>${sifat}</p>
</div>

<button class="share-btn"
onclick="sharePrimbon()">
📲 Bagikan Hasil
</button>

`;

}

function sharePrimbon(){

const text=
document.getElementById("hasilPrimbon").innerText;

if(navigator.share){

navigator.share({
title:"Primbon Nusantara",
text:text
});

}else{

navigator.clipboard.writeText(text);

alert("Hasil berhasil disalin");

}

}
</script>

</body>
</html>
